<!-- ─── LOADING SCREEN ─────────────────────────────────────────────────────── -->
<div id="loading-screen" style="
  position:fixed;inset:0;background:#080D1A;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:9999;
">
  <div style="
    width:52px;height:52px;border-radius:14px;
    background:linear-gradient(135deg,#6366F1,#4F46E5);
    display:grid;place-items:center;font-size:28px;
    box-shadow:0 8px 24px rgba(99,102,241,0.4);
  ">💰</div>
  <div style="font-family:-apple-system,sans-serif;color:#F0F4FF;font-size:1.1rem;font-weight:700;letter-spacing:-0.3px;">FinanceFlow</div>
  <div style="display:flex;gap:6px;margin-top:4px;">
    <span style="width:8px;height:8px;border-radius:50%;background:#6366F1;animation:dot 1.2s 0s infinite;"></span>
    <span style="width:8px;height:8px;border-radius:50%;background:#6366F1;animation:dot 1.2s 0.2s infinite;"></span>
    <span style="width:8px;height:8px;border-radius:50%;background:#6366F1;animation:dot 1.2s 0.4s infinite;"></span>
  </div>
  <div id="loading-msg" style="font-family:-apple-system,sans-serif;color:#4A5A80;font-size:0.8rem;">Conectando ao banco de dados...</div>
  <style>
    @keyframes dot { 0%,80%,100%{opacity:0.2;transform:scale(0.8)} 40%{opacity:1;transform:scale(1)} }
  </style>
</div>

<!-- ─── INIT: aguarda banco antes de iniciar ───────────────────────── -->
<script>
(async () => {
  const loading = document.getElementById('loading-screen');
  const msg     = document.getElementById('loading-msg');

  try {
    msg.textContent = 'Carregando dados...';
    const ok = await Storage.init();

    if (!ok) {
      msg.textContent = '⚠ API offline — verifique se o servidor está rodando';
      msg.style.color = '#F59E0B';
      // Aguarda 2s para o usuário ver o aviso, depois inicia com cache vazio
      await new Promise(r => setTimeout(r, 2000));
    }

    // Esconde loading e inicia o app
    loading.style.transition = 'opacity 0.3s';
    loading.style.opacity = '0';
    setTimeout(() => loading.remove(), 300);

    App.init();

  } catch (e) {
    msg.textContent = '❌ Erro ao iniciar: ' + e.message;
    msg.style.color = '#EF4444';
    console.error('[Init]', e);
  }
})();
</script>
